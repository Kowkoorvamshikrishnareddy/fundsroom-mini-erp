services:
  - type: web
    name: fundsroom-erp-backend
    env: node
    buildCommand: "cd backend && npm install && npm run build && npx prisma generate && npx prisma db push"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "5000"

databases:
  - name: fundsroom-erp-db
    databaseName: erp_db
    user: erp_user
